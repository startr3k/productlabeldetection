name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        # requirements.txt is deliberately not installed: its pins do not build
        # on modern Python and the suite mocks every Google Cloud / Firebase
        # boundary, so no production or cloud dependencies are needed here.
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest
