name: tests

# Runs on every push to any branch, and on pull requests. The suite is intended
# to run here rather than on developer machines: it needs no credentials and no
# network, so CI is the single place it executes.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        # requirements.txt is deliberately not installed. Its pins do not build
        # on a current Python (numpy==1.19.5, Pillow==8.3.1) and the suite stubs
        # every Google Cloud / Firebase boundary, so no production or cloud
        # dependency is needed to run it. See issues #4 and #16.
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # `python -m pytest` rather than `pytest`: the repo modules live at the
        # root, and this puts the working directory on sys.path. pytest.ini also
        # sets `pythonpath = .` so a bare `pytest` works too.
        run: python -m pytest
