name: open-pr-on-assign

# Opens a draft pull request whenever an issue is assigned, so the assignee gets
# a branch and a review thread without setting them up by hand.
#
# Four behaviours to know before relying on this:
#
# 1. The pull request starts empty. GitHub needs at least one commit the base
#    branch does not have, so the branch gets a single empty commit. The diff
#    stays empty until the assignee pushes real work.
#
# 2. The branch push does not trigger CI, but opening the pull request does.
#    Pushes made with GITHUB_TOKEN never start workflow runs, so there is no
#    push-event run for the initial empty commit. The pull_request event from
#    gh pr create is not suppressed the same way: tests.yml runs against the
#    pull request immediately (observed on the first auto-created PR, #24).
#
# 3. Only the copy of this file on the default branch runs. Editing it on a
#    feature branch has no effect until that branch is merged.
#
# 4. The pull request body mentions @droid, which is how the Droid session is
#    summoned: droid.yml reacts to the mention in the opened pull request and
#    starts working on the issue. The droid-action deliberately has no
#    assignee trigger (it is disabled in the action's source), so a direct call
#    on this `assigned` event would no-op; the mention in the PR body is the
#    supported path. This costs one Droid run per assignment, and requires
#    droid.yml to list github-actions[bot] in allowed_bots, because the pull
#    request is bot-authored.

on:
  issues:
    types: [assigned]

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Assigning several people in quick succession fires one event each. Serialise
  # them so the duplicate check below cannot race against itself.
  group: open-pr-on-assign-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive the branch name from the issue
        id: branch
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          slug=$(printf '%s' "$ISSUE_TITLE" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g' \
            | cut -c1-48 \
            | sed -E 's/^-+|-+$//g')
          echo "name=issue-${ISSUE_NUMBER}${slug:+-$slug}" >> "$GITHUB_OUTPUT"

      - name: Check whether work is already under way
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          # Re-assigning an issue, or adding a second assignee, fires this
          # workflow again. Neither should produce a duplicate branch or PR.
          if [ -n "$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
                       --head "$BRANCH" --json number --jq '.[].number')" ]; then
            echo "A pull request for $BRANCH is already open; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists on the remote; leaving it alone."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the branch
        if: steps.check.outputs.skip == 'false'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit --allow-empty -m "Start work on #${ISSUE_NUMBER}: ${ISSUE_TITLE}"
          git push -u origin "$BRANCH"

      - name: Open the draft pull request
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          BASE: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ASSIGNEE: ${{ github.event.assignee.login }}
        run: |
          body=$(cat <<EOF
          Opened automatically because #${ISSUE_NUMBER} was assigned to @${ASSIGNEE}.

          Closes #${ISSUE_NUMBER}

          @droid work on this: implement what #${ISSUE_NUMBER} describes and push
          your commits to the \`${BRANCH}\` branch. Read the linked issue for the
          requirements, keep the change scoped to it, and run the test suite
          before pushing.

          This starts as an empty draft. The branch \`${BRANCH}\` holds one empty
          commit, which is the minimum GitHub needs to open a pull request. Push
          your work to it and mark the pull request ready for review when it is.

          The branch push did not trigger a push-event CI run (pushes made with
          GITHUB_TOKEN never do), but opening this pull request fired the
          pull_request event, so the test suite has already run against it.
          EOF
          )

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE" \
            --head "$BRANCH" \
            --title "$ISSUE_TITLE" \
            --body "$body" \
            --draft

          # Done as a separate edit so that an assignee the token cannot set
          # (an outside collaborator, for instance) warns instead of failing the
          # run and leaving a branch with no pull request.
          gh pr edit "$BRANCH" --repo "$GITHUB_REPOSITORY" --add-assignee "$ASSIGNEE" \
            || echo "::warning::Could not assign @${ASSIGNEE} to the pull request."
